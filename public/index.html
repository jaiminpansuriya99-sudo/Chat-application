<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Chat App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #06b6d4;      /* Cyan */
    --secondary: #6366f1;    /* Indigo */
    --accent: #ec4899;       /* Pink */
    --bg-dark: #030712;      /* Deep Navy/Black */
    --bg-dark-panel: rgba(10, 15, 30, 0.45);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(6, 182, 212, 0.3);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
}

*{box-sizing:border-box;}
body{
    margin:0;
    font-family: 'Outfit', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background: radial-gradient(circle at center, #0a0f24 0%, var(--bg-dark) 100%);
    transition: 0.3s;
    color: var(--text-primary);
    overflow: hidden;
    position: relative;
    animation: pageReveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes pageReveal {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Background grid scanlines */
body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: 1;
}

#welcome-screen{
    background: var(--bg-dark-panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 48px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 212, 255, 0.1);
    max-width: 420px;
    width: 90%;
    z-index: 10;
    animation: fadeIn 0.5s ease;
    transition: all 0.3s ease;
}
#welcome-screen h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
}
#welcome-screen p {
    color: var(--text-secondary);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 32px;
}
#welcome-screen button{
    padding: 14px 36px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #030712;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    transition: all 0.3s ease;
}
#welcome-screen button:hover{
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.55);
}

#chat-container{
    width: 440px;
    height: 650px;
    display: none;
    flex-direction: column;
    background: var(--bg-dark-panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0, 212, 255, 0.1);
    backdrop-filter: blur(16px);
    position: relative;
    z-index: 10;
    animation: fadeIn 0.5s ease;
}

#chat-header{
    padding: 20px 24px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    background: rgba(2, 6, 12, 0.6);
    color: var(--text-primary);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#dark-toggle{
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
}
#dark-toggle:hover{
    border-color: var(--primary);
    background: rgba(6, 182, 212, 0.1);
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
} 
.messages::-webkit-scrollbar{width:6px;} 
.messages::-webkit-scrollbar-thumb{background:rgba(255, 255, 255, 0.15); border-radius:10px;} 

.messages li {
    display: flex;
    align-items: flex-end;
    font-size: 0.95rem;
    max-width: 80%;
    word-wrap: break-word;
    position: relative;
    animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    list-style: none;
    line-height: 1.45;
} 
.messages li img{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    margin-right: 10px;
    border: 1px solid var(--border);
} 

.client {
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(99, 102, 241, 0.15));
    border: 1px solid var(--border-hover);
    align-self: flex-end;
    border-radius: 18px 18px 0 18px;
    padding: 12px 18px;
    color: var(--text-primary);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
} 
.server {
    background: rgba(2, 6, 12, 0.5);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-radius: 18px 18px 18px 0;
    padding: 12px 18px;
    color: var(--text-secondary);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
} 

.msg-text {
    flex-grow: 1;
}

.tick {
    font-size: 0.75rem;
    margin-left: 8px;
    color: var(--text-muted);
} 
.tick.read {
    color: var(--primary);
    text-shadow: 0 0 5px rgba(6, 182, 212, 0.5);
} 

.input-container {
    display: flex;
    padding: 16px 20px;
    background: rgba(2, 6, 12, 0.6);
    border-top: 1px solid var(--border);
    gap: 12px;
    align-items: center;
} 

#msg {
    flex: 1;
    padding: 12px 20px;
    border-radius: 50px;
    border: 1px solid var(--border);
    background: rgba(2, 6, 12, 0.7);
    color: var(--text-primary);
    outline: none;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.3s;
} 
#msg:focus {
    border-color: var(--primary);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
} 

#send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #030712;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    transition: all 0.3s;
} 
#send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
}

/* Light Theme Variables Overrides */
body.light {
    background: radial-gradient(circle at center, #f4f6fa 0%, #e2e8f0 100%);
    --bg-dark-panel: rgba(255, 255, 255, 0.75);
    --border: rgba(0, 0, 0, 0.08);
    --border-hover: rgba(6, 182, 212, 0.4);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
}
body.light::before {
    background-image: linear-gradient(rgba(0, 0, 0, 0.015) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
}
body.light .server {
    background: rgba(255, 255, 255, 0.9);
}
body.light .client {
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(99, 102, 241, 0.1));
}
body.light #welcome-screen {
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

@media(max-width:480px){
    #chat-container{width:92%;height:80vh;}
}
</style>
</head>
<body>

<div id="welcome-screen">
    <h1>Welcome to Real Chat!</h1>
    <p>Connect and chat live with the server.</p>
    <button id="start-btn">Start New Chat</button>
</div>

<div id="chat-container">
    <div id="chat-header">
        <span>Chat App</span>
        <button id="dark-toggle"><i class="fa-solid fa-moon"></i></button>
    </div>
    <ul class="messages" id="messages"></ul>
    <div class="input-container">
        <input id="msg" placeholder="Type a message..." autocomplete="off" />
        <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const welcomeScreen = document.getElementById('welcome-screen');
const startBtn = document.getElementById('start-btn');
const chatContainer = document.getElementById('chat-container');
const messages = document.getElementById('messages');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send-btn');
const darkToggle = document.getElementById('dark-toggle');

const clientId = Date.now();

darkToggle.addEventListener('click', () => {
    document.body.classList.toggle('light');
    const icon = darkToggle.querySelector('i');
    if (document.body.classList.contains('light')) {
        icon.className = 'fa-solid fa-sun';
    } else {
        icon.className = 'fa-solid fa-moon';
    }
});

startBtn.addEventListener('click', () => {
    welcomeScreen.style.display = 'none';
    chatContainer.style.display = 'flex';
    messages.innerHTML = '';
    socket.emit('new chat');
});

function addMessage(msgObj){
    const li = document.createElement('li');
    li.className = msgObj.sender;

    if(msgObj.sender==='server'){
        const avatar = document.createElement('img');
        avatar.src='/images/server-avatar.png';
        li.appendChild(avatar);
    }

    // Bug fixed: Wrap text in a span so appending ticks doesn't overwrite it
    const textSpan = document.createElement('span');
    textSpan.className = 'msg-text';
    textSpan.textContent = msgObj.text;
    li.appendChild(textSpan);

    if(msgObj.sender==='client'){
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.textContent = msgObj.status === 'read' ? '✔✔' : '✔';
        if(msgObj.status === 'read') tick.classList.add('read');
        li.appendChild(tick);

        if(msgObj.clientId !== clientId){
            socket.emit('message read', msgObj.id);
        }
    }

    messages.appendChild(li);
    messages.scrollTop = messages.scrollHeight;
}

sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if(!text) return;

    const msgObj = {
        id: Date.now(),
        sender: 'client',
        text,
        status: 'sent',
        clientId
    };

    addMessage(msgObj);
    socket.emit('chat message', msgObj);
    input.value='';
});

input.addEventListener('keypress', e => { if(e.key==='Enter') sendBtn.click(); });

socket.on('new message', msgObj => {
    if(msgObj.sender === 'client' && msgObj.clientId === clientId) return;
    addMessage(msgObj);
});

socket.on('update status', ({id,status}) => {
    const items = messages.querySelectorAll('li.client');
    items.forEach(li=>{
        const tick = li.querySelector('.tick');
        if(tick && !tick.classList.contains('read')){
            if(status==='read'){ tick.classList.add('read'); tick.textContent='✔✔'; }
        }
    });
});

socket.on('chat history', history => {
    messages.innerHTML='';
    history.forEach(msgObj => addMessage(msgObj));
});
</script>
</body>
</html>
